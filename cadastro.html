<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo"><a href="index.html">Sua Academia</a></header>

  <main class="pagina">
    <section class="destaque">
      <h1>Treine do seu jeito.</h1>
      <p>Crie sua conta em menos de um minuto e escolha seu plano depois.</p>
    </section>

    <section class="painel">
      <div class="cartao">
        <h2>Criar conta</h2>
        <p class="sub">Preencha seus dados para começar.</p>

        <form id="form-cadastro" novalidate>
          <div class="campo">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" autocomplete="name">
            <span class="erro" aria-live="polite"></span>
          </div>

          <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" autocomplete="email">
            <span class="erro" aria-live="polite"></span>
          </div>

          <div class="duas-colunas">
            <div class="campo">
              <label for="cpf">CPF</label>
              <input type="text" id="cpf" name="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00">
              <span class="erro" aria-live="polite"></span>
            </div>
            <div class="campo">
              <label for="nascimento">Data de nascimento</label>
              <input type="date" id="nascimento" name="nascimento" autocomplete="bday">
              <span class="erro" aria-live="polite"></span>
            </div>
          </div>

          <div id="bloco-responsavel" hidden>
            <div class="campo">
              <label for="responsavel">Nome do responsável</label>
              <input type="text" id="responsavel" name="responsavel">
              <span class="erro" aria-live="polite"></span>
            </div>
            <div class="campo">
              <label class="termos">
                <input type="checkbox" id="autorizacao" name="autorizacao">
                <span>Um responsável vai me acompanhar nos treinos.</span>
              </label>
              <span class="erro" aria-live="polite"></span>
            </div>
          </div>

          <div class="campo">
            <label for="telefone">Celular</label>
            <input type="tel" id="telefone" name="telefone" maxlength="15" placeholder="(00) 00000-0000" autocomplete="tel">
            <span class="erro" aria-live="polite"></span>
          </div>

          <div class="duas-colunas">
            <div class="campo">
              <label for="senha">Senha</label>
              <input type="password" id="senha" name="senha" autocomplete="new-password">
              <span class="erro" aria-live="polite"></span>
            </div>
            <div class="campo">
              <label for="confirma">Confirmar senha</label>
              <input type="password" id="confirma" name="confirma" autocomplete="new-password">
              <span class="erro" aria-live="polite"></span>
            </div>
          </div>

          <div class="campo">
            <label class="termos">
              <input type="checkbox" id="termos" name="termos">
              <span>Li e aceito os termos de uso e a política de privacidade.</span>
            </label>
            <span class="erro" aria-live="polite"></span>
          </div>

          <div class="botoes">
            <button type="submit" class="btn btn-primario">Criar conta</button>
            <button type="reset" class="btn btn-secundario">Limpar</button>
          </div>

          <div id="mensagem" class="mensagem" role="status"></div>
        </form>

        <p class="alternar">Já tem conta? <a href="login.html">Entrar</a></p>
      </div>
    </section>
  </main>

  <script src="cadastro.js"></script>
</body>
</html>
